# Athena default configuration
# Override any value via CLI flags or ATHENA_* environment variables.

project:
  name: athena
  data_dir: data
  persist_dir: data/chroma

# --- Ingestion pipeline ---
ingestion:
  # Supported: pdf, txt, md
  supported_extensions: [".pdf", ".txt", ".md"]
  # Skip re-processing if file hash matches stored fingerprint
  incremental: true
  chunk:
    # Character-based chunking (simple, predictable for interviews)
    size: 512
    overlap: 64
    # Minimum chunk size; smaller tail fragments are merged or dropped
    min_size: 100

# --- Embeddings (local, free) ---
embeddings:
  model: sentence-transformers/all-MiniLM-L6-v2
  # Batch size trades memory for throughput during ingestion
  batch_size: 32
  device: cpu  # set to "cuda" or "mps" if available

# --- Vector store ---
vector_store:
  collection_name: athena_documents
  # ChromaDB persists to disk automatically under persist_dir

# --- Hybrid retrieval ---
retrieval:
  # How many candidates each retriever returns before fusion
  dense_top_k: 20
  sparse_top_k: 20
  # Final shortlist after RRF fusion, before reranking
  fusion_top_k: 10
  # Final results after cross-encoder reranking
  rerank_top_k: 5
  # Reciprocal Rank Fusion constant (standard default = 60)
  rrf_k: 60

# --- Cross-encoder reranker ---
reranker:
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  batch_size: 16

# --- Evaluation ---
eval:
  k_values: [1, 3, 5, 10]
  qa_file: data/eval/qa_pairs.json

# --- LLM (agent synthesis) ---
llm:
  # Provider: openrouter | grok | openai | ollama | extractive
  provider: openrouter
  model: llama3.2
  openai_model: gpt-4o-mini
  grok_model: grok-beta
  # Free OpenRouter Models: liquid/lfm-2.5-2.6b:free | google/gemma-4-26b-a4b-it:free
  openrouter_model: liquid/lfm-2.5-2.6b:free
  temperature: 0.1
  max_tokens: 512





# --- Agent routing ---
agent:
  # Keywords that trigger web search (current events, live data)
  web_keywords: [latest, current, today, news, recent, "2025", "2026", price, stock]
  # Minimum RAG confidence to skip web fallback (rerank score)
  rag_confidence_threshold: 0.3
  max_web_results: 5

# --- API server ---
api:
  host: 0.0.0.0
  port: 8000
  cors_origins: ["http://localhost:5173", "http://localhost:3000"]
  db_path: data/athena.db

# --- Query logging ---
logging:
  enabled: true
  db_path: data/athena.db
